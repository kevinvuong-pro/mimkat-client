services:
  client:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.mimkat-client.rule=Host(`${APP_HOST:?APP_HOST is required}`)
      - traefik.http.routers.mimkat-client.entrypoints=websecure
      - traefik.http.routers.mimkat-client.tls=true
      - traefik.http.routers.mimkat-client.tls.certresolver=${TRAEFIK_CERTRESOLVER:?TRAEFIK_CERTRESOLVER is required}
      - traefik.http.services.mimkat-client.loadbalancer.server.port=3000
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  proxy:
    external: true
